<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Homework for Life</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✍️</text></svg>" />

<link rel="preconnect" href="https://esm.sh" crossorigin />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />

<!-- Critical CSS: paints the shell before Tailwind/React arrive, so there is no flash -->
<style>
  :root {
    --surface-1: #fcfcfb; --page: #f7f7f5;
    --ink: #0b0b0b; --ink-2: #52514e; --muted: #8a8880;
    --grid: #e6e5df; --baseline: #c3c2b7;
    --pos: #2a78d6; --neg: #e34948; --neu: #c3c2b7;
    --seq-100: #cde2fb; --seq-200: #9ec5f4; --seq-300: #6da7ec;
    --seq-400: #3987e5; --seq-550: #1c5cab; --seq-700: #0d366b;
    --accent: #2a78d6;
  }
  html.dark {
    --surface-1: #17171a; --page: #0a0a0c;
    --ink: #ffffff; --ink-2: #c3c2b7; --muted: #8a8880;
    --grid: #2a2a2e; --baseline: #3a3a3f;
    --pos: #3987e5; --neg: #e66767; --neu: #52514e;
    --seq-100: #0d366b; --seq-200: #104281; --seq-300: #184f95;
    --seq-400: #256abf; --seq-550: #5598e7; --seq-700: #9ec5f4;
    --accent: #3987e5;
  }
  html { background: var(--page); }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* ambient gradient mesh */
  .mesh::before, .mesh::after {
    content: ""; position: fixed; border-radius: 9999px; pointer-events: none;
    filter: blur(90px); z-index: 0;
  }
  .mesh::before {
    width: 45vw; height: 45vw; top: -14vw; left: -10vw;
    background: radial-gradient(circle, rgba(99,102,241,.20), transparent 70%);
  }
  .mesh::after {
    width: 42vw; height: 42vw; top: 32vh; right: -12vw;
    background: radial-gradient(circle, rgba(217,70,239,.14), transparent 70%);
  }
  html.dark .mesh::before { background: radial-gradient(circle, rgba(99,102,241,.26), transparent 70%); }
  html.dark .mesh::after  { background: radial-gradient(circle, rgba(217,70,239,.18), transparent 70%); }

  #boot {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 14px; color: var(--muted); font-size: 13px;
  }
  #boot .ring {
    width: 30px; height: 30px; border-radius: 50%;
    border: 2.5px solid var(--grid); border-top-color: #6366f1;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .axis-t { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .lbl { fill: var(--ink-2); font-size: 11.5px; }
  .lbl-strong { fill: var(--ink); font-size: 11.5px; font-weight: 600; }
  .gridline { stroke: var(--grid); stroke-width: 1; }
  .baseline-s { stroke: var(--baseline); stroke-width: 1; }
  ::selection { background: rgba(99,102,241,.22); }
  ::-webkit-scrollbar { width: 11px; height: 11px; }
  ::-webkit-scrollbar-thumb { background: var(--baseline); border-radius: 99px; border: 3px solid var(--page); }
</style>

<!-- Tailwind v4 (browser build) + theme config -->
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style type="text/tailwindcss">
  @custom-variant dark (&:where(.dark, .dark *));
  @theme {
    --font-sans: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    --color-ink: var(--ink);
    --color-ink2: var(--ink-2);
    --color-muted: var(--muted);
    --color-surface: var(--surface-1);
  }
</style>

<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19",
    "react-dom": "https://esm.sh/react-dom@19",
    "react-dom/client": "https://esm.sh/react-dom@19/client",
    "react/jsx-runtime": "https://esm.sh/react@19/jsx-runtime",
    "framer-motion": "https://esm.sh/framer-motion@11?external=react,react-dom"
  }
}
</script>
</head>
<body class="mesh">
  <div id="boot"><div class="ring"></div><div>Loading…</div></div>
  <div id="root" class="relative z-10"></div>
  <script type="module" src="app.js"></script>
  <noscript style="display:block;padding:40px;text-align:center">This journal needs JavaScript enabled.</noscript>
</body>
</html>
